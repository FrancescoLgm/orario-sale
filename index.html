/* ══════════════════════════════════════════
   MENSILE — NAVIGAZIONE
══════════════════════════════════════════ */
const MONTHS_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                   'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DAYS_SHORT = ['D','L','M','M','G','V','S'];

function monthKey()   { return curMonth.toISOString().slice(0,7); }
function monthLabel() { return `${MONTHS_IT[curMonth.getMonth()]} ${curMonth.getFullYear()}`; }
function prevMonth()  { curMonth.setMonth(curMonth.getMonth()-1); renderMonthly(); syncMobileNav(); }
function nextMonth()  { curMonth.setMonth(curMonth.getMonth()+1); renderMonthly(); syncMobileNav(); }

function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

function getMonthSlot(doctorId, day) {
  return S.monthlySchedule?.[monthKey()]?.[doctorId]?.[day] ?? null;
}
function setMonthSlot(doctorId, day, data) {
  const mk = monthKey();
  if (!S.monthlySchedule[mk]) S.monthlySchedule[mk] = {};
  if (!S.monthlySchedule[mk][doctorId]) S.monthlySchedule[mk][doctorId] = {};
  if (data === null) delete S.monthlySchedule[mk][doctorId][day];
  else S.monthlySchedule[mk][doctorId][day] = data;
}

/* ══════════════════════════════════════════
   MENSILE — GRIGLIA
══════════════════════════════════════════ */
function renderMonthly() {
  document.getElementById('monthLabel').textContent = monthLabel();
  const wrap = document.getElementById('monthlyGridWrap');
  const year  = curMonth.getFullYear();
  const month = curMonth.getMonth();
  const days  = daysInMonth(year, month);
  const mk    = monthKey();

  if (!S.doctors.length) {
    wrap.innerHTML = '<div class="empty-state" style="padding:40px">Nessun dottore in anagrafica.<br>Aggiungili dalla sezione Sale Operatorie.</div>';
    return;
  }

  const holidays = italianHolidays(year);
  const isHoliday = d => holidays.some(h => h.getMonth() === month && h.getDate() === d);

  let html = '<table class="monthly-table"><thead><tr>';
  html += '<th class="doc-col">Dottore</th>';
  for (let d = 1; d <= days; d++) {
    const dow  = new Date(year, month, d).getDay();
    const isWE = dow === 0;
    const isHol = isHoliday(d);
    const cls  = isWE ? 'weekend' : isHol ? 'holiday' : '';
    html += `<th class="${cls}">${d}<br><span style="font-weight:400;opacity:.7">${DAYS_SHORT[dow]}</span></th>`;
  }
  html += '<th style="background:#f0fdf4;min-width:64px">Totale</th></tr></thead><tbody>';

  const sortedDoctors = [...S.doctors].sort((a, b) => a.name.localeCompare(b.name, 'it'));
  sortedDoctors.forEach(doc => {
    html += `<tr><td class="doc-col" onclick="openDoctorMonth('${doc.id}')" title="Visualizza mese completo">${doc.name}</td>`;
    let totShifts = 0, totRS = 0, totRT = 0;

    for (let d = 1; d <= days; d++) {
      const slot = getMonthSlotRaw(mk, doc.id, d);
      const st   = slot?.shiftTypeId ? S.shiftTypes.find(t => t.id === slot.shiftTypeId) : null;
      if (st)          totShifts += st.weight;
      if (slot?.repSala)      totRS++;
      if (slot?.repTrasporti) totRT++;

      const dow    = new Date(year, month, d).getDay();
      const isWE   = dow === 0;
      const isHol  = isHoliday(d);
      const abbr   = st ? (st.sigla || st.name.slice(0,2).toUpperCase()) : '';
      const cellBg = st ? lighten(st.color, 0.78) : isHol ? '#fef9c3' : '';
      const fg     = st ? st.color : '';
      const cls    = isWE ? 'weekend' : isHol ? 'holiday' : '';

      html += `<td class="${cls}" style="${cellBg ? `background:${cellBg}` : ''}">
        <div class="shift-cell" onclick="openCellAssign('${doc.id}',${d},this,event)">
          ${st ? `<span class="shift-abbr" style="color:${fg}">${abbr}</span>` : ''}
          ${(slot?.repSala || slot?.repTrasporti) ? `<div class="rep-row">
            ${slot.repSala      ? '<span class="rep-dot rep-sala">RS</span>'  : ''}
            ${slot.repTrasporti ? '<span class="rep-dot rep-trasp">RT</span>' : ''}
          </div>` : ''}
        </div>
      </td>`;
    }

    html += `<td class="tot-cell">
      <div style="font-size:14px;font-weight:800;color:#16a34a">${totShifts}</div>
      <div style="font-size:9px;color:#64748b">RS:${totRS} RT:${totRT}</div>
    </td></tr>`;
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function getMonthSlotRaw(mk, doctorId, day) {
  return S.monthlySchedule?.[mk]?.[doctorId]?.[day] ?? null;
}

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
function openCellAssign(doctorId, day, triggerEl, evt) {
  if (evt) evt.stopPropagation();
  cellAssignCtx = { doctorId, day };
  const doc  = S.doctors.find(d => d.id === doctorId);
  const slot = getMonthSlot(doctorId, day);
  const date = new Date(curMonth.getFullYear(), curMonth.getMonth(), day);

  document.getElementById('cpTitle').textContent = doc?.name || '';
  document.getElementById('cpSub').textContent =
    `${['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][date.getDay()]} ${day} ${MONTHS_IT[curMonth.getMonth()]}`;

  selShiftTypeId = slot?.shiftTypeId || null;
  renderCellPopoverShifts();
  updateCellRepButtons();

  // Posizionamento
  const pop  = document.getElementById('cellPopover');
  pop.classList.add('open');
  const src  = triggerEl ? triggerEl.getBoundingClientRect()
                         : { left: window.innerWidth/2 - 125, bottom: 100, top: 100, right: window.innerWidth/2 + 125 };
  const pw = 250, ph = 180;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = src.left;
  let top  = src.bottom + 6;
  if (left + pw > vw - 8) left = src.right - pw;
  if (top  + ph > vh - 8) top  = src.top - ph - 6;
  left = Math.max(8, left);
  top  = Math.max(8, top);
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
}

function renderCellPopoverShifts() {
  const g = document.getElementById('cpShifts');
  let html = `<button class="cp-shift-none${!selShiftTypeId ? ' sel' : ''}" onclick="selCellShift(null)" title="Nessun turno">—</button>`;
  html += S.shiftTypes.map(st => {
    const isSel  = selShiftTypeId === st.id;
    const sigla  = st.sigla || st.name.slice(0,2).toUpperCase();
    const bg     = lighten(st.color, isSel ? 0.65 : 0.84);
    return `<button class="cp-shift-pill${isSel ? ' sel' : ''}"
              style="background:${bg};color:${st.color}"
              title="${st.name}"
              onclick="selCellShift('${st.id}')">${sigla}</button>`;
  }).join('');
  g.innerHTML = html;
}

function updateCellRepButtons() {
  const slot = cellAssignCtx ? getMonthSlot(cellAssignCtx.doctorId, cellAssignCtx.day) : null;
  document.getElementById('cpRepSala').className  = `cp-rep-btn${slot?.repSala      ? ' on-sala'  : ''}`;
  document.getElementById('cpRepTrasp').className = `cp-rep-btn${slot?.repTrasporti ? ' on-trasp' : ''}`;
}

function selCellShift(id) {
  if (!cellAssignCtx) return;
  selShiftTypeId = id;
  const slot = getMonthSlot(cellAssignCtx.doctorId, cellAssignCtx.day) || {};
  const data = (id || slot.repSala || slot.repTrasporti)
    ? { shiftTypeId: id, repSala: !!slot.repSala, repTrasporti: !!slot.repTrasporti }
    : null;
  setMonthSlot(cellAssignCtx.doctorId, cellAssignCtx.day, data);
  save(); renderMonthly();
  renderCellPopoverShifts();
}

function toggleCellRep(type) {
  if (!cellAssignCtx) return;
  const slot = getMonthSlot(cellAssignCtx.doctorId, cellAssignCtx.day) || {};
  if (type === 'sala')  slot.repSala      = !slot.repSala;
  if (type === 'trasp') slot.repTrasporti = !slot.repTrasporti;
  const hasData = slot.shiftTypeId || slot.repSala || slot.repTrasporti;
  setMonthSlot(cellAssignCtx.doctorId, cellAssignCtx.day, hasData ? slot : null);
  save(); renderMonthly();
  updateCellRepButtons();
}

function closeCellPopover() {
  document.getElementById('cellPopover').classList.remove('open');
  cellAssignCtx = null;
}

══════════════════════════════════════════ */
function openDoctorMonth(doctorId) {
  const doc   = S.doctors.find(d => d.id === doctorId);
  const year  = curMonth.getFullYear();
  const month = curMonth.getMonth();
  const days  = daysInMonth(year, month);
  const mk    = monthKey();

  document.getElementById('docMonthTitle').textContent = doc?.name || '';
  document.getElementById('docMonthSub').textContent   = `${MONTHS_IT[month]} ${year}`;

  let html = '';
  for (let d = 1; d <= days; d++) {
    const date  = new Date(year, month, d);
    const dow   = date.getDay();
    const isWE  = dow === 0 || dow === 6;
    const slot  = getMonthSlotRaw(mk, doctorId, d);

    const shiftOpts = S.shiftTypes.map(st => {
      const isSel = slot?.shiftTypeId === st.id;
      const bg    = isSel ? lighten(st.color, 0.7) : '';
      const style = isSel ? `background:${bg};color:${st.color};border-color:${st.color};font-weight:800` : '';
      return `<span class="shift-type-opt${isSel?' sel':''}" style="${style};padding:3px 10px;font-size:11px"
               onclick="setDocDayShift('${doctorId}',${d},'${st.id}',this)">${st.name}</span>`;
    }).join('');

    const rsOn  = slot?.repSala      ? 'on-sala'  : '';
    const rtOn  = slot?.repTrasporti ? 'on-trasp' : '';
    const noSt  = !slot?.shiftTypeId;
    const noneStyle = noSt ? 'border-color:#64748b;color:#64748b' : '';

    html += `<div class="doc-day-row">
      <div class="doc-day-label${isWE ? ' weekend' : ''}">
        <strong>${d}</strong><br><span style="font-size:10px">${['D','L','M','M','G','V','S'][dow]}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
        <span class="shift-type-opt none-opt${noSt?' sel':''}" style="padding:3px 10px;font-size:11px;${noneStyle}"
          onclick="setDocDayShift('${doctorId}',${d},null,this)">—</span>
        ${shiftOpts}
      </div>
      <button class="rep-toggle ${rsOn}" onclick="toggleDocDayRep('${doctorId}',${d},'sala',this)">RS</button>
      <button class="rep-toggle ${rtOn}" onclick="toggleDocDayRep('${doctorId}',${d},'trasp',this)">RT</button>
    </div>`;
  }

  document.getElementById('docMonthContent').innerHTML = html;
  openModal('ovDoctorMonth');
}

function setDocDayShift(doctorId, day, shiftTypeId, el) {
  const slot = getMonthSlot(doctorId, day) || {};
  const data = (shiftTypeId || slot.repSala || slot.repTrasporti)
    ? { ...slot, shiftTypeId: shiftTypeId || null }
    : null;
  setMonthSlot(doctorId, day, data);
  save();
  // update buttons in row
  const row  = el.closest('.doc-day-row');
  row.querySelectorAll('.shift-type-opt').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  renderMonthly();
}

function toggleDocDayRep(doctorId, day, type, btn) {
  const slot = getMonthSlot(doctorId, day) || {};
  if (type === 'sala')  slot.repSala      = !slot.repSala;
  if (type === 'trasp') slot.repTrasporti = !slot.repTrasporti;
  const hasData = slot.shiftTypeId || slot.repSala || slot.repTrasporti;
  setMonthSlot(doctorId, day, hasData ? slot : null);
  save();
  if (type === 'sala')  btn.className = `rep-toggle ${slot.repSala      ? 'on-sala'  : ''}`;
  if (type === 'trasp') btn.className = `rep-toggle ${slot.repTrasporti ? 'on-trasp' : ''}`;
  renderMonthly();
}

  const name = document.getElementById('stName').value.trim();
  if (!name) { toast('Inserisci il nome del turno'); return; }
  const weight   = parseFloat(document.querySelector('input[name="stWeight"]:checked')?.value || '1');

  const sigla = document.getElementById('stSigla').value.trim().toUpperCase().slice(0, 3)
                || name.slice(0, 2).toUpperCase();

    if (st) { st.name = name; st.sigla = sigla; st.weight = weight; st.color = selShiftColor; st.blocks = blocks; st.coverage = coverage; }

  Object.values(S.monthlySchedule).forEach(month =>
    Object.values(month).forEach(doc =>
      Object.values(doc).forEach(slot => { if (slot.shiftTypeId === id) slot.shiftTypeId = null; })
    )
  );
  save(); renderShiftTypeList(); renderMonthly();
  toast('Tipo turno eliminato');
}

/* ══════════════════════════════════════════
   FESTIVITÀ ITALIANE
══════════════════════════════════════════ */
function calcEaster(year) {
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const mo = Math.floor((h+l-7*m+114)/31) - 1;
  const dy = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, mo, dy);
}

function italianHolidays(year) {
  const fixed = [[1,1],[1,6],[4,25],[5,1],[6,2],[8,15],[11,1],[12,8],[12,25],[12,26]];
  const dates = fixed.map(([mo,dy]) => new Date(year, mo-1, dy));
  const easter = calcEaster(year);
  const pasquetta = new Date(easter); pasquetta.setDate(pasquetta.getDate()+1);
  dates.push(pasquetta);
  return dates;
}

function workingDaysInMonth(year, month) {
  const days     = daysInMonth(year, month);
  const holidays = italianHolidays(year);
  let count = 0;
  for (let d = 1; d <= days; d++) {
    const date  = new Date(year, month, d);
    const isSun = date.getDay() === 0;
    const isHol = holidays.some(h => h.getFullYear()===year && h.getMonth()===month && h.getDate()===d);
    if (!isSun && !isHol) count++;
  }
  return count;
}

    const typeBreak = S.shiftTypes.map(st => `<span style="font-size:11px;color:var(--muted)">${(st.sigla || st.name.slice(0,2).toUpperCase())}:${byType[st.id]||0}</span>`).join(' ');
    return `<tr style="border-bottom:1px solid #f1f5f9">
      <td style="padding:8px 12px;font-weight:600">${doc.name}</td>
      <td style="padding:8px;text-align:center;font-size:16px;font-weight:800;color:#0f172a">${totShifts}</td>
      <td style="padding:8px;text-align:center;font-weight:600;color:#64748b">${wDays}</td>
      <td style="padding:8px;text-align:center;font-size:15px;font-weight:800;color:${extraCol}">${extraSign}${extra}</td>
      <td style="padding:8px;text-align:center;font-weight:700;color:#b91c1c">${totRS}</td>
      <td style="padding:8px;text-align:center;font-weight:700;color:#1e40af">${totRT}</td>
      <td style="padding:8px 12px;font-size:11px">${typeBreak}</td>
    </tr>`;
  }).join('');

  document.getElementById('reportContent').innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">
      Giorni lavorativi del mese (escluse festività italiane): <strong>${wDays}</strong>
    </div>
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="background:#f8fafc;border-bottom:2px solid var(--border)">
          <th style="padding:8px 12px;text-align:left">Dottore</th>
          <th style="padding:8px;text-align:center">T. Totali</th>
          <th style="padding:8px;text-align:center;color:#64748b">T. Mese</th>
          <th style="padding:8px;text-align:center;color:#16a34a">T. Aggiuntivi</th>
          <th style="padding:8px;text-align:center;color:#b91c1c">Rep. Sala</th>
          <th style="padding:8px;text-align:center;color:#1e40af">Rep. Trasp.</th>
          <th style="padding:8px 12px;text-align:left">Dettaglio</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  openModal('ovMonthReport');
}

/* ══════════════════════════════════════════
   LANDSCAPE TOGGLE (mobile)
══════════════════════════════════════════ */
let isLandscapeForced = false;

function toggleLandscape() {
  isLandscapeForced = !isLandscapeForced;
  document.getElementById('stage').classList.toggle('force-landscape', isLandscapeForced);
  const btn = document.getElementById('rotateBtn');
  btn.innerHTML = isLandscapeForced ? '&#x21BA;' : '&#x21BB;';
  btn.classList.toggle('active', isLandscapeForced);
}

window.addEventListener('orientationchange', () => {
  if (isLandscapeForced) {
    isLandscapeForced = false;
    document.getElementById('stage').classList.remove('force-landscape');
    const btn = document.getElementById('rotateBtn');
    btn.innerHTML = '&#x21BB;';
    btn.classList.remove('active');
  }
});

(async () => {
  if (IS_SERVER) {
    // Controlla se già autenticato
    try {
      const me = await fetch('/api/me').then(r => r.json());
      if (!me.ok) { showLoginOverlay(); return; }
    } catch(e) { showLoginOverlay(); return; }
    hideLoginOverlay();
  }
  const ok = await loadState();
  if (ok) render();
})();
</script>
